<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cafetería Arequipa</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f9; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #4a2c2a; }
        .status { padding: 6px 12px; background: #d4edda; color: #155724; border-radius: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>☕ Cafetería Arequipa</h1>
        <p>Sistema de Pedidos en Línea</p>
        <span class="status">🟢 Servidor Desplegado con Éxito</span>
    </div>
</body>
</html>
